name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          pip install mypy pytest

      - name: Lint with mypy
        run: mypy config/ services/ models/ routes/ --config-file ../pyproject.toml || true

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_SERVICE_KEY: test-key
          DATABASE_URL: postgresql://test:test@localhost/test
          GROQ_API_KEY: gsk-test
          SUPER_ADMIN_KEY: test-super-admin-key
          LEGACY_HASH_FOR_TESTS: "True"
          VAPID_PUBLIC_KEY: test-vapid-public-key
          VAPID_PRIVATE_KEY: test-vapid-private-key

  frontend:
    name: Frontend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b --noEmit || true

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to HF Spaces
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to HF Spaces
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            API_REPO="data-rag/assistant-reussite-api"
            UI_REPO="data-rag/assistant-reussite.ai"
          else
            API_REPO="data-rag/assistant-reussite-api-dev"
            UI_REPO="data-rag/assistant-reussite-dev-ui"
          fi

          git remote add hf-api "https://data-rag:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/${API_REPO}"
          git remote add hf-ui "https://data-rag:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/${UI_REPO}"

          git push hf-api HEAD:main --force
          git push hf-ui HEAD:main --force
